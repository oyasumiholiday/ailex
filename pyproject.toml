[project]
name = "intentir"
version = "0.15.0a3"
description = "A content-addressed semantic IR with executable contracts for AI development workflows."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]

[project.scripts]
intentir = "intentir.cli:main"
intentir-mcp = "intentir.mcp_server:main"
intentir-notation = "intentir.notation_lab:main"
intentir-openai-adapter = "intentir.providers.openai_responses:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intentir*"]

[tool.setuptools.package-data]
"intentir.templates.todo" = [
  "README_JA.md",
  "add_task_priority.patch.json",
  "todo.intent",
]
